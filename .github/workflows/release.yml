name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" ] || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)" >&2
            exit 1
          }
      - name: Test
        run: make test
      - name: Build app and DMG
        run: make dmg
      - name: Zip app bundle
        run: cd dist && ditto -c -k --keepParent Dangle.app Dangle.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Dangle ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/Dangle.dmg dist/Dangle.zip
